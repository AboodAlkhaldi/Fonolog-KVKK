<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sayfa Bulunamadı — Fonolog</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,800;1,9..144,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css" />
  <style>
    .not-found {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem var(--px);
    }
    .not-found .code {
      font-family: var(--serif);
      font-size: clamp(5rem, 20vw, 10rem);
      font-weight: 800;
      color: var(--amber);
      opacity: .18;
      line-height: 1;
      margin-bottom: 1rem;
    }
    .not-found h1 {
      font-family: var(--serif);
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 600;
      color: var(--text);
      margin-bottom: .8rem;
    }
    .not-found p {
      font-family: var(--sans);
      font-size: .95rem;
      color: var(--muted);
      margin-bottom: 2rem;
      font-weight: 300;
    }
    .back-home {
      background: var(--amber);
      color: #1a1206;
      font-family: var(--sans);
      font-weight: 500;
      font-size: .95rem;
      padding: .85rem 2rem;
      border-radius: 100px;
      text-decoration: none;
      transition: transform .2s, box-shadow .2s;
      box-shadow: 0 4px 24px rgba(255,183,77,.3);
    }
    .back-home:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(255,183,77,.4); }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="nav-logo">
      <img src="app-logo.png" alt="Fonolog logo" class="logo-mark" />
      <span>Fonolog</span>
    </a>
    <div class="nav-links">
      <a href="privacy.html">Gizlilik</a>
      <a href="terms.html">Koşullar</a>
      <a href="data-safety.html">Veri Güvenliği</a>
      <a href="account-deletion.html">Hesap Sil</a>
      <a href="mailto:fonologpro@gmail.com" class="nav-cta">İletişim</a>
    </div>
  </nav>

  <div class="not-found">
    <div class="code">404</div>
    <h1>Sayfa bulunamadı</h1>
    <p>Aradığınız sayfa taşınmış veya silinmiş olabilir.</p>
    <a href="index.html" class="back-home">Ana Sayfaya Dön</a>
  </div>

  <footer class="footer">

      <div class="footer-links">
        <a href="privacy.html">Gizlilik Politikası</a>

    </div>
  </footer>

</html>
